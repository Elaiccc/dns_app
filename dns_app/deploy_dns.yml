# Author: Ziyi Liu (zl6722)
# Replace YOUR_REGISTRY with your reachable image registry and account.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dns-records
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-as
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-as
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dns-as
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: as
          image: YOUR_REGISTRY/dcn-as:lab3
          imagePullPolicy: Always
          ports:
            - containerPort: 53533
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: DB_PATH
              value: /data/records.sqlite3
          volumeMounts:
            - name: records
              mountPath: /data
      volumes:
        - name: records
          persistentVolumeClaim:
            claimName: dns-records
---
apiVersion: v1
kind: Service
metadata:
  name: dns-as
spec:
  type: NodePort
  selector:
    app: dns-as
  ports:
    - name: as
      protocol: UDP
      port: 53533
      targetPort: 53533
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-fs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-fs
  template:
    metadata:
      labels:
        app: dns-fs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: fs
          image: YOUR_REGISTRY/dcn-fs:lab3
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dns-fs
spec:
  type: NodePort
  selector:
    app: dns-fs
  ports:
    - name: fs
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-us
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-us
  template:
    metadata:
      labels:
        app: dns-us
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: us
          image: YOUR_REGISTRY/dcn-us:lab3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dns-us
spec:
  type: NodePort
  selector:
    app: dns-us
  ports:
    - name: us
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30003
